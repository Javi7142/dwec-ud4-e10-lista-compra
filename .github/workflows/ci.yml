name: Integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  comprobaciones:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar las dependencias
        run: npm ci

      - name: Revisar el código con ESLint
        run: npm run lint

      - name: Comprobar el formato con Prettier
        run: npm run format:check

      - name: Ejecutar los tests
        run: npm test
